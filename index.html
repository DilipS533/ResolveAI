<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0E11" />
    <title>OpenLoop — Give an outcome. We'll stay on it.</title>
    <meta
      name="description"
      content="OpenLoop is an autonomous agent that takes ownership of unfinished outcomes and stays on them until they are actually resolved."
    />
    <!--
      Theme is resolved before first paint: `dark` is already on <html> above,
      so this only has to honour a stored preference and keep the browser's own
      colour-scheme in step. Without it the page would flash the wrong ground.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("openloop.theme");
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          var root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0E0E11" : "#FBFBFD");
        } catch (error) {
          /* Storage unavailable: the `dark` class on <html> already stands. */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
